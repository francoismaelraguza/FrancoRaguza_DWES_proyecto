<!doctype html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, user-scalable=no, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="ie=edge">
    <title>Principal</title>
    <link rel="stylesheet" th:href="@{/css/styles.css}">
</head>
<body class="body-index">
    <div th:replace="~{layout :: header('inicio')}"></div>
    <main>
        <h1>Bienvenido a PokémonWeb!</h1>
        <img class="prof" th:src="@{/img/profesor.png}" alt="profesor">

        <form class="formulario-login" th:action="@{/login}" th:object="${trainer}" method="post">
            <label for="trainer">Trainer: </label>
            <input type="text" id="trainer" th:field="*{user}"
                   th:errorclass="campo-error" required>
            <span class="mensaje-error" th:if="${#fields.hasErrors('user')}"
                  th:errors="*{user}">Mensaje de error</span>
            <button type="submit">Enviar</button>
        </form>
    </main>
    <div th:replace="~{layout :: footer}"></div>

</body>
</html>
