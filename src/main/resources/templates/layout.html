<!doctype html>
<html lang="s" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">

</head>
<body>
<!--cabecera-->
<header th:fragment="header(paginaActiva)" class="header">
    <div class="logo">
        <img th:src="@{/img/pokeball.svg.webp}" alt="pokelogo">
    </div>
    <nav>
        <a th:href="@{/}"
           th:classappend="${paginaActiva == 'inicio'} ? 'activo'">Inicio</a>

    </nav>
</header>

<!--pie-->
<footer th:fragment="footer">
    <div>
        <p>Proyecto Pokémon®</p>

        <p>Franco Ismael Raguza</p>
    </div>
    <div>
        <p th:text="${fecha}">Fecha</p>
    </div>
</footer>


</body>
</html>
